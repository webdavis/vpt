[package]
name = "vpt-adapters"
version = "0.1.0"
edition = "2024"

[dependencies]
vpt-application = { path = "../vpt-application" }
vpt-domain = { path = "../vpt-domain" }
vpt-protocol = { path = "../vpt-protocol" }
libc = "0.2.189"
jiff = "=0.2.37"
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled"] }
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde", "std"] }
saphyr-parser = "=0.0.11"
html-escape = "=0.2.15"
pulldown-cmark = { version = "=0.13.4", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
vpt-domain = { path = "../vpt-domain", features = ["fixtures"] }
