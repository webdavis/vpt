[package]
name = "vpt-adapters"
version = "0.1.0"
edition = "2024"

[dependencies]
vpt-application = { path = "../vpt-application" }
vpt-domain = { path = "../vpt-domain" }
vpt-protocol = { path = "../vpt-protocol" }
libc = "0.2.189"
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
tempfile = "3.27.0"
vpt-domain = { path = "../vpt-domain", features = ["fixtures"] }
