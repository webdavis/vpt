[package]
name = "vpt"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[[bin]]
name = "vpt"
path = "src/main.rs"

[features]
dev-tools = ["dep:libc"]

[[bin]]
name = "vpt-fake-engine"
path = "src/bin/vpt-fake-engine.rs"
required-features = ["dev-tools"]

[dependencies]
vpt-adapters = { path = "../vpt-adapters" }
vpt-application = { path = "../vpt-application" }
vpt-domain = { path = "../vpt-domain" }
vpt-protocol = { path = "../vpt-protocol" }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
libc = { version = "0.2.189", optional = true }

[dev-dependencies]
libc = "0.2.189"
tempfile = "3.27.0"
toon-format = { version = "=0.7.0", default-features = false }
serde_yaml_ng = "=0.10.0"
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled"] }
vpt-domain = { path = "../vpt-domain", features = ["fixtures"] }
